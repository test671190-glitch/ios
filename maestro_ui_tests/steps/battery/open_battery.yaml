# Opens the tonkeeprdemo mode Battery refill screen from the wallet header.
appId: com.jbig.tonkeeprdemomode
---
- scrollUntilVisible:
    element:
      id: wallet_battery
    direction: UP
    timeout: 20000
- tapOn:
    id: wallet_battery
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: tonkeeprdemo mode Battery
    timeout: 30000
