workflows:
  tonkeeper-unsigned:
    name: Tonkeeper fork (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Keeper.xcodeproj"
        XCODE_SCHEME: "Keeper"
    scripts:
      - name: Положить GoogleService-Info.plist из секрета
        script: |
          set -e
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "error: в Codemagic не задана секретная переменная GOOGLE_SERVICE_INFO_PLIST_B64 (base64 от GoogleService-Info.plist для Keeper)" >&2
            exit 1
          fi
          DEST="$CM_BUILD_DIR/Keeper/Resources/Firebase/Keeper"
          mkdir -p "$DEST"
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > "$DEST/GoogleService-Info.plist"
          plutil -lint "$DEST/GoogleService-Info.plist"

      - name: Сборка без подписи в .xcarchive
        script: |
          set -e
          # ENABLE_USER_SCRIPT_SANDBOXING=NO: скрипт Crashlytics+dSYM отправляет dSYM по сети,
          # песочница user scripts (включена в проекте) этого не разрешает.
          # Без -configuration: конфигурация архива берётся из схемы Keeper (KeeperRelease).
          # В проекте нет конфигурации Debug, а при -configuration Debug пакеты SPM и таргеты
          # раскладывали продукты в разные папки (Debug-iphoneos и KeeperDebug-iphoneos).
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Tonkeeper.xcarchive" \
            archive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Упаковка .xcarchive в unsigned .ipa
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/Tonkeeper.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r Tonkeeper-unsigned.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/Tonkeeper-unsigned.ipa
      - $CM_BUILD_DIR/build.log
