workflows:
  tonkeepr-demo-mode-unsigned:
    name: tonkeeprdemo mode fork (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - secrets
      xcode: latest
      vars:
        XCODE_PROJECT: "Keeper.xcodeproj"
        XCODE_SCHEME: "Keeper"
    scripts:
      - name: Сборка без подписи в .xcarchive
        script: |
          set -e
          # Без -configuration: конфигурация архива берётся из схемы Keeper (KeeperRelease).
          # В проекте нет конфигурации Debug, а при -configuration Debug пакеты SPM и таргеты
          # раскладывали продукты в разные папки (Debug-iphoneos и KeeperDebug-iphoneos).
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/TonkeeprDemoMode.xcarchive" \
            archive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Упаковка .xcarchive в unsigned .ipa
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/TonkeeprDemoMode.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r TonkeeprDemoMode-unsigned.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/TonkeeprDemoMode-unsigned.ipa
      - $CM_BUILD_DIR/build.log
