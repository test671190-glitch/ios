workflows:
  tonkeeper-unsigned:
    name: Tonkeeper fork (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Keeper.xcodeproj"
        XCODE_SCHEME: "Tonkeeper"
    scripts:
      - name: Список схем (узнать точное имя XCODE_SCHEME)
        script: |
          xcodebuild -list -project "$XCODE_PROJECT" || true

      - name: Сборка без подписи в .xcarchive
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Tonkeeper.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Упаковка .xcarchive в unsigned .ipa
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/Tonkeeper.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r Tonkeeper-unsigned.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/Tonkeeper-unsigned.ipa
      - $CM_BUILD_DIR/build.log
